name: CI

on:
  workflow_dispatch:  # manual trigger only

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install uv==0.11.21
          uv sync --locked --all-extras --python ${{ matrix.python-version }}

      - name: Lint
        run: uv run --locked --all-extras --python ${{ matrix.python-version }} ruff check src/

      - name: Test
        run: uv run --locked --all-extras --python ${{ matrix.python-version }} pytest tests/ -v
